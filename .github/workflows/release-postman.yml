# Attaches the Postman/Insomnia collection to a GitHub Release. Tag: postman/vX.Y.Z (version in postman/version.toml)
name: Release Postman

on:
  push:
    tags: ['postman/v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-version.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' postman/version.toml)"
      - uses: softprops/action-gh-release@v2
        with:
          files: postman/zapz.postman_collection.json
