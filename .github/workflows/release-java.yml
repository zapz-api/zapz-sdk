# Publishes dev.zapz:zapz-java to Maven Central (Central Portal). Tag: java/vX.Y.Z
# Secrets: CENTRAL_USERNAME / CENTRAL_PASSWORD (Central Portal user token),
# GPG_PRIVATE_KEY (armored) and GPG_PASSPHRASE.
name: Release Java

on:
  push:
    tags: ['java/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: ../.github/scripts/check-version.sh "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
      - run: mvn -B -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
