# Publishes the `zapz` gem with RubyGems Trusted Publishing (OIDC). Tag: ruby/vX.Y.Z
# Repository variable RUBYGEMS_OWNER_ID: the RubyGems.org account ID shown on its Pending
# Trusted Publishers page. Only the first push (gem does not exist yet) needs it.
name: Release Ruby

on:
  push:
    tags: ['ruby/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ../.github/scripts/check-version.sh "$(ruby -e 'puts Gem::Specification.load("zapz.gemspec").version')"
      - uses: rubygems/configure-rubygems-credentials@v2.2.0
        with:
          owner: ${{ vars.RUBYGEMS_OWNER_ID }}
      - run: gem build zapz.gemspec && gem push zapz-*.gem
