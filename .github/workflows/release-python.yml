# Publishes `zapz` to PyPI with Trusted Publishing (OIDC). Tag: python/vX.Y.Z
name: Release Python

on:
  push:
    tags: ['python/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ../.github/scripts/check-version.sh "$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
      - run: python -m pip install --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
