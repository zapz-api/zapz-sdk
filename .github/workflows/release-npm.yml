# Publishes the npm packages with npm Trusted Publishing (OIDC, no token) and provenance.
# Tags: node/vX.Y.Z -> @zapz/sdk, mcp/vX.Y.Z -> @zapz/mcp (+ Docker image), n8n/vX.Y.Z -> n8n-nodes-zapz
name: Release npm

on:
  push:
    tags: ['node/v*', 'mcp/v*', 'n8n/v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ startsWith(github.ref_name, 'node/') && 'node' || startsWith(github.ref_name, 'mcp/') && 'mcp' || 'n8n' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: ../.github/scripts/check-version.sh "$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # npm 11.5+ exchanges the GitHub OIDC token for a publish token (trusted publisher set on npmjs.com)
      - run: npm install -g npm@latest
      - run: npm publish --access public

  docker-mcp:
    if: startsWith(github.ref_name, 'mcp/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#mcp/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: mcp
          push: true
          tags: |
            ghcr.io/zapz-api/zapz-mcp:${{ steps.v.outputs.version }}
            ghcr.io/zapz-api/zapz-mcp:latest
