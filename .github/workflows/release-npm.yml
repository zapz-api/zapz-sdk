# Publishes the npm packages with npm Trusted Publishing (OIDC, no token) and provenance.
# Tags: node/vX.Y.Z -> @zapz/sdk, mcp/vX.Y.Z -> @zapz/mcp (+ Docker image), n8n/vX.Y.Z -> @zapz/n8n-nodes-zapz
name: Release npm

on:
  push:
    tags: ['node/v*', 'mcp/v*', 'n8n/v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ startsWith(github.ref_name, 'node/') && 'node' || startsWith(github.ref_name, 'mcp/') && 'mcp' || 'n8n' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: ../.github/scripts/check-version.sh "$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # npm 11.5+ exchanges the GitHub OIDC token for a publish token (trusted publisher set on npmjs.com)
      - run: npm install -g npm@latest
      - run: npm publish --access public

  docker-mcp:
    if: startsWith(github.ref_name, 'mcp/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#mcp/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: mcp
          push: true
          tags: |
            ghcr.io/zapz-api/zapz-mcp:${{ steps.v.outputs.version }}
            ghcr.io/zapz-api/zapz-mcp:latest

  # Lists the server in the official MCP Registry (registry.modelcontextprotocol.io). The registry
  # checks that `mcpName` in the published package.json matches the name in mcp/server.json, and
  # GitHub OIDC proves the io.github.zapz-api namespace.
  mcp-registry:
    if: startsWith(github.ref_name, 'mcp/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#mcp/v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      # The registry reads mcpName from npm, which can take a few minutes to serve a new version.
      - name: Wait for the npm version
        run: |
          version="${GITHUB_REF_NAME#mcp/v}"
          for _ in $(seq 1 30); do
            [ "$(npm view "@zapz/mcp@$version" mcpName 2>/dev/null)" = "io.github.zapz-api/zapz-mcp" ] && exit 0
            sleep 10
          done
          echo "::error::@zapz/mcp@$version is not on npm after 5 minutes"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
