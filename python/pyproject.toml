[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zapz"
version = "0.1.0"
description = "Official Python SDK for the ZapZ WhatsApp API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["whatsapp", "api", "zapz", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
include = ["zapz*"]

[tool.setuptools.package-data]
zapz = ["py.typed"]
